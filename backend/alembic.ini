# Alembic configuration for Sportsbook Me DFS AI
#
# The DATABASE_URL is read from the environment by migrations/env.py.
# The sqlalchemy.url value below is a development fallback only.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Do not hardcode production credentials here.
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/apex_dfs

[post_write_hooks]
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S